<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriGuard AI - Real Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f7f6; color: #1c2d27; text-align: center; padding: 20px; }
        .camera-box { position: relative; width: 100%; max-width: 500px; height: 350px; margin: 20px auto; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-line { position: absolute; width: 100%; height: 2px; background: #10b981; box-shadow: 0 0 10px #10b981; top: 0; display: none; animation: scan 2s infinite ease-in-out; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
        .btn { padding: 12px 24px; border: none; background: #10b981; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 5px; }
        .btn-stop { background: #ef4444; }
        .result-card { max-width: 500px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; text-align: left; display: none; }
        .result-card h3 { margin-bottom: 10px; color: #10b981; }
    </style>
</head>
<body>

    <h2>🌿 AgriGuard AI - Live Scanner</h2>

    <div class="camera-box">
        <video id="webcam" autoplay playsinline></video>
        <div class="scan-line" id="scanLine"></div>
    </div>

    <button class="btn" id="startBtn">📷 Start & Scan</button>
    <button class="btn btn-stop" id="stopBtn">Stop</button>

    <div class="result-card" id="resultCard">
        <h3>🔍 Real-Time Diagnosis Result</h3>
        <p><strong>Disease Name:</strong> <span id="diseaseName">Scanning...</span></p>
        <p><strong>Accuracy Confidence:</strong> <span id="confidence">-</span></p>
        <p><strong>Action Guidance:</strong> <span id="recommendation">-</span></p>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const scanLine = document.getElementById('scanLine');
        const resultCard = document.getElementById('resultCard');
        const canvas = document.getElementById('canvas');

        let stream = null;
        let intervalId = null;

        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                scanLine.style.display = 'block';
                resultCard.style.display = 'block';

                // 3 விநாடிக்கு ஒருமுறை லைவ் ஃபிரேம் எடுத்து AI-க்கு அனுப்பும்
                intervalId = setInterval(captureAndSend, 3000);
            } catch (err) {
                alert("Camera Access Denied or Not Supported!");
            }
        });

        stopBtn.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            scanLine.style.display = 'none';
            clearInterval(intervalId);
        });

        async function captureAndSend() {
            if (!stream) return;

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = canvas.toDataURL('image/jpeg');

            // Python Flask API-க்கு படத்த அனுப்பும் இடம்
            try {
                const response = await fetch('http://127.0.0.1:5000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('diseaseName').textContent = data.disease;
                    document.getElementById('confidence').textContent = data.confidence;
                    document.getElementById('recommendation').textContent = data.recommendation;
                }
            } catch (error) {
                console.error("API Error:", error);
            }
        }
    </script>
</body>
</html>

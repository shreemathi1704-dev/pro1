<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriGuard AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f6f8f6;
            color: #1a2e22;
        }

        header {
            display: flex;
            align-items: center;
            padding: 1rem 5%;
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2e7d32;
        }

        .hero {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }

        .hero-title {
            font-size: 2rem;
            color: #111827;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        .scanner-container {
            max-width: 650px;
            margin: 1rem auto;
            padding: 0 1rem;
        }

        .camera-box {
            position: relative;
            width: 100%;
            height: 350px;
            background-color: #2d3748;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .crop-frame {
            position: absolute;
            width: 65%;
            height: 65%;
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            width: 65%;
            height: 2px;
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
            display: none;
            animation: scan 2.5s infinite ease-in-out;
        }

        @keyframes scan {
            0% { top: 18%; }
            50% { top: 78%; }
            100% { top: 18%; }
        }

        .camera-status {
            position: absolute;
            bottom: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 1.25rem;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: #10b981;
            color: white;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: #374151;
            border-color: #d1d5db;
        }

        /* Result Section */
        .result-box {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: white;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            display: none;
            text-align: left;
        }

        .result-box h3 {
            color: #111827;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .result-item {
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
            color: #374151;
        }

        .confidence {
            font-weight: bold;
            color: #059669;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🌿 AgriGuard AI</div>
    </header>

    <section class="hero">
        <h1 class="hero-title">Scan your crop</h1>
    </section>

    <div class="scanner-container">
        <div class="camera-box">
            <video id="webcam" autoplay playsinline></video>
            <div class="crop-frame"></div>
            <div class="scan-line" id="scanLine"></div>
            <div class="camera-status" id="statusText">Automatic scanning is off</div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn">📷 Start Camera</button>
            <button class="btn btn-secondary" id="stopBtn">Stop</button>
        </div>

        <!-- Scanning Result Container -->
        <div class="result-box" id="resultBox">
            <h3>🔍 Detection Result</h3>
            <p class="result-item"><strong>Status:</strong> <span id="detectedDisease">Analyzing...</span></p>
            <p class="result-item"><strong>Confidence:</strong> <span class="confidence" id="confidenceLevel">-</span></p>
            <p class="result-item"><strong>Recommendation:</strong> <span id="recommendation">-</span></p>
        </div>
    </div>

    <!-- Hidden canvas to capture frames -->
    <canvas id="captureCanvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('webcam');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const scanLine = document.getElementById('scanLine');
        const resultBox = document.getElementById('resultBox');
        const canvas = document.getElementById('captureCanvas');

        let stream = null;
        let scanInterval = null;

        startBtn.addEventListener('click', async () => {
            statusText.textContent = 'Starting camera...';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                statusText.textContent = 'Automatic scanning is active';
                scanLine.style.display = 'block';
                resultBox.style.display = 'block';

                // Start automatic scanning every 3 seconds
                scanInterval = setInterval(processFrame, 3000);
            } catch (err) {
                console.error("Camera access error:", err);
                statusText.textContent = 'Unable to access camera';
            }
        });

        stopBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                statusText.textContent = 'Automatic scanning is off';
                scanLine.style.display = 'none';
                clearInterval(scanInterval);
            }
        });

        function processFrame() {
            if (!stream) return;

            // Capture image frame onto hidden canvas
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Get image as Base64 format
            const imageData = canvas.toDataURL('image/jpeg');

            // --- Real AI Backend Connection Logic ---
            /*
            fetch('YOUR_BACKEND_API_URL/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('detectedDisease').textContent = data.disease;
                document.getElementById('confidenceLevel').textContent = data.confidence + '%';
                document.getElementById('recommendation').textContent = data.recommendation;
            });
            */

            // Temporary Simulation (Replace this with real API call above)
            displayMockResult();
        }

        function displayMockResult() {
            document.getElementById('detectedDisease').textContent = "Healthy Leaf / Normal";
            document.getElementById('confidenceLevel').textContent = "94.2%";
            document.getElementById('recommendation').textContent = "No disease detected. Maintain regular watering.";
        }
    </script>
</body>
</html>

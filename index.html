<!DOCTYPE html>
<html>
<head>
    <title>AgriGuard AI Test</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f2fff5;
        }

        button,
        label {
            display: inline-block;
            padding: 18px 25px;
            margin: 10px;
            background: green;
            color: white;
            border: 0;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        input {
            display: none;
        }

        #photo {
            max-width: 500px;
            width: 90%;
            margin-top: 20px;
            display: none;
        }

        #camera {
            width: 90%;
            max-width: 500px;
            display: none;
            background: black;
        }
    </style>
</head>

<body>

<h1>🌱 AgriGuard AI</h1>

<h2>Crop Scanner</h2>

<!-- UPLOAD -->
<label for="file">
    🖼️ UPLOAD IMAGE
</label>

<input
    type="file"
    id="file"
    accept="image/*"
>

<br>

<!-- CAMERA -->
<button id="start">
    📷 START CAMERA
</button>

<button id="capture">
    📸 CAPTURE
</button>

<button id="stop">
    ⛔ STOP
</button>

<br>

<video
    id="camera"
    autoplay
    playsinline>
</video>

<img id="photo">

<h3 id="message">
    Ready...
</h3>


<script>

let cameraStream = null;


// ======================
// UPLOAD
// ======================

document.getElementById("file").onchange = function () {

    const file = this.files[0];

    if (!file) {
        return;
    }

    const photo =
        document.getElementById("photo");

    photo.src =
        URL.createObjectURL(file);

    photo.style.display = "block";

    document.getElementById("message").innerText =
        "✅ IMAGE UPLOADED SUCCESSFULLY";

};


// ======================
// START CAMERA
// ======================

document.getElementById("start").onclick =
async function () {

    try {

        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "environment"
                },
                audio: false
            });

        const camera =
            document.getElementById("camera");

        camera.srcObject =
            cameraStream;

        camera.style.display =
            "block";

        document.getElementById("message").innerText =
            "✅ CAMERA STARTED";

    }

    catch (error) {

        console.log(error);

        alert(
            "Camera permission allow pannunga."
        );

    }

};


// ======================
// CAPTURE
// ======================

document.getElementById("capture").onclick =
function () {

    if (!cameraStream) {

        alert(
            "First START CAMERA click pannunga."
        );

        return;
    }

    const camera =
        document.getElementById("camera");

    const canvas =
        document.createElement("canvas");

    canvas.width =
        camera.videoWidth;

    canvas.height =
        camera.videoHeight;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const photo =
        document.getElementById("photo");

    photo.src =
        canvas.toDataURL("image/jpeg");

    photo.style.display =
        "block";

    document.getElementById("message").innerText =
        "✅ PHOTO CAPTURED";

};


// ======================
// STOP CAMERA
// ======================

document.getElementById("stop").onclick =
function () {

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(function(track) {
                track.stop();
            });

        cameraStream = null;
    }

    document.getElementById("camera")
        .style.display = "none";

    document.getElementById("message").innerText =
        "Camera stopped.";

};

</script>

</body>
</html>
